# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Starlord-strongest

#on:
#  push:
#    branches:
#      - main
#  workflow_dispatch:

env:
  # ✅ Access the environment-specific secret
  DATABASE_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
  WEBAPP_BASE_URL: http://localhost:3000
  STANDALONE_BUILD_PATH: '.next/standalone'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '19.3.0'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present
          STANDALONE_PATH="${{ env.STANDALONE_BUILD_PATH }}"
          STANDALONE_NEXT_PATH="$STANDALONE_PATH/.next"
          cp -r .next/static $STANDALONE_NEXT_PATH/static
          cp -r public $STANDALONE_PATH/public

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ${{ env.STANDALONE_BUILD_PATH }}
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ${{ env.STANDALONE_BUILD_PATH }}
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.__clientidsecretname__ }}
          tenant-id: ${{ secrets.__tenantidsecretname__ }}
          subscription-id: ${{ secrets.__subscriptionidsecretname__ }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Starlord-strongest'
          slot-name: 'Production'
          package: ${{ env.STANDALONE_BUILD_PATH }}